server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for non-file paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API + probes to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Exported report PDFs are served from the backend's /reports static mount.
    location /reports/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # WebSocket live tick stream — upgrade headers required.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
