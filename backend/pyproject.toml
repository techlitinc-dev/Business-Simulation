[project]
name = "forge-backend"
version = "0.1.0"
description = "The Forge — AI-powered business simulation backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in signatures is intentional

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["weasyprint.*", "markdown"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # Third-party libs still trip deprecated stdlib APIs on Python 3.12
    "ignore:.*'crypt' is deprecated.*:DeprecationWarning",
    "ignore:Accessing argon2.__version__ is deprecated.*:DeprecationWarning",
]
