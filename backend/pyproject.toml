[project]
name = "forge-backend"
version = "0.1.0"
description = "The Forge — AI-powered business simulation backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in signatures is intentional

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["weasyprint.*", "markdown"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
concurrency = ["thread"]
source = ["app"]
omit = ["app/workers/*", "app/utils/pdf.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.json]
show_contexts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # Third-party libs still trip deprecated stdlib APIs on Python 3.12
    "ignore:.*'crypt' is deprecated.*:DeprecationWarning",
    "ignore:Accessing argon2.__version__ is deprecated.*:DeprecationWarning",
    # matplotlib 3.9 pulls pyparsing 3.x which deprecates oneOf/parseString,
    # resetCache, enablePackrat, etc. (pyparsing >= 3.1 removed the
    # pyparsing.warnings module, so match by class name)
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]
